# 规则模板：行测-题目与答案混排（样例 A 型）
#
# 适配特征：答案紧跟在题目之后、与题目交错；同一文件内混用多种答案写法；
#           选项一行可含 2~4 个；题号会在大题组内重置。

id: docx-mixed
name: 行测-题目与答案混排
description: 答案分散在题后、写法多样（如「2、【解析】C。」「9、B【解析】」）

question_no:
  patterns:
    - '^\s*(\d{1,4})\s*[、.．]\s*'
    # 数字推理题的【16】形式
    - '^\s*【\s*(\d{1,4})\s*】\s*'

# 选项标记：不带 ^ 锚点，供行内扫描（样例 A 一行常含 2~4 个选项）
option_mark:
  # A. / A、 / A． 裸标记
  - '(?<![A-Za-z0-9])([A-D])\s*[.．、]'
  # (A) / [A] / （A）/ 【A】 形式
  - '[\[（(【]\s*([A-D])\s*[\]）)】]'

# 实测归纳出的 4 种答案写法（同一文件内混用）
answer:
  rules:
    # 末尾吞掉句末标点，避免污染解析正文
    - pattern: '^\s*(\d{1,4})\s*[、.．]\s*【解析】\s*([A-D])(?![A-Za-z])\s*[。.．、]?'
      confidence: 0.95
    - pattern: '^\s*(\d{1,4})\s*[、.．]\s*([A-D])\s*【解析】'
      confidence: 0.95
    - pattern: '^\s*(\d{1,4})\s*[、.．]\s*【答案】\s*([A-D])(?![A-Za-z])\s*[。.．、]?'
      confidence: 0.95
    # 裸标记，置信度略低
    - pattern: '^\s*(\d{1,4})\s*[、.．]\s*([A-D])\s*解析'
      confidence: 0.90

explanation:
  patterns:
    - '^\s*解析[：:]'
    - '^\s*解析[一二三四五六七八九十]?[：:]'
    - '^\s*解析\s*$'

# 解析分区标题，出现后进入「答案/解析」上下文
answer_section:
  patterns:
    - '^答案与解析\s*$'
    - '^参考答案\s*[:：]?\s*$'
    - '^答案解析\s*$'
    - '^答案\s*$'

group_title:
  patterns:
    - '^\s*第[一二三四五六七八九十]+部分\s*(.+)$'
    - '^\s*([一二三四五六七八九十]+)、\s*(.+)$'

noise:
  - '各类考试包过无忧'
  - 'offertop'

defaults:
  question_type: single
  option_count_hint: 4
