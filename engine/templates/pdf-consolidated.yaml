# 规则模板：行测/EPI-答案集中式
#
# 适配特征：题目区在前、答案区集中在后（卷尾以「答案解析：」开头）；
#           题号在全文唯一；答案写法在同一份文件里就可能混用多种。
#
# 正则约定：
#   - 题号 / 选项 / answer 规则的**第 1 个捕获组**是关键值
#   - answer 规则的第 2 个捕获组是答案字母
#   - answer_letter 规则的**第 1 个捕获组**是答案字母

id: pdf-consolidated
name: 行测/EPI-答案集中式
description: 题目区与答案区分离，答案集中在卷尾「答案解析：」之后（如「解析：正确答案是[D]。」）

question_no:
  patterns:
    # 表格里的纯数值行由 rules.is_numeric_only() 统一拦截，
    # 这里不能加 (?!\d)——否则 `2．1984 年消耗…`、`27.5 年前甲…`
    # 这类「题号后紧跟数字」的题会被整批漏掉
    - '^\s*(\d{1,4})\s*[.．]\s*'
    - '^\s*(\d{1,4})\s*、\s*'
    # 数字推理题的【16】形式（实测 EPI 样卷的第二部分用这种）
    - '^\s*【\s*(\d{1,4})\s*】\s*'

# 选项标记：不带 ^ 锚点，供行内扫描（一行可能含多个选项）
# 实测样卷的选项有 A–E 五个
option_mark:
  # [A] / （A）/ (A) / 【A】 / ［A］ 形式
  - '[\[［（(【]\s*([A-E])\s*[\]］）)】]'
  # A. / A、 / A． 裸标记
  - '(?<![A-Za-z0-9])([A-E])\s*[.．、]'

# 行级答案规则：整行同时含题号与答案字母时直接命中（快路径）
answer:
  rules:
    # 末尾可选地吞掉「]）」和「。」，否则这些符号会污染解析正文
    - pattern: '^\s*(\d{1,4})\s*[.．、]\s*解析[：:]\s*正确答案是\s*[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*[。.．]?'
      confidence: 0.99
    - pattern: '^\s*(\d{1,4})\s*[.．、]\s*参考答案[：:]\s*[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*[。.．]?'
      confidence: 0.95
    - pattern: '^\s*(\d{1,4})\s*[.．、]\s*【解析】\s*[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*[。.．]?'
      confidence: 0.95
    - pattern: '^\s*(\d{1,4})\s*[.．、]\s*【答案】\s*[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*[。.．]?'
      confidence: 0.95

# 区块级答案字母抽取：按优先级依次尝试，第一个命中即采用。
# 这条链路是实测催生的——样卷里混用了 8 种写法，且存在「题号与答案字母
# 不在同一行」的情况（`10、` 换行后才是 `B【解析】`），逐行匹配会错位。
answer_letter:
  rules:
    # 【答案】C / ［答案］C
    - pattern: '[【［]答案[】］]\s*[\[［（(【]?\s*([A-E])(?![A-Za-z])'
      confidence: 0.95
    # 【解析】C / ［解析］C
    - pattern: '[【［]解析[】］]\s*[\[［（(【]?\s*([A-E])(?![A-Za-z])'
      confidence: 0.93
    # 正确答案是[D] / 正确答案为 C
    - pattern: '正确答案\s*[是为是选]?\s*[\[［（(【]?\s*([A-E])(?![A-Za-z])'
      confidence: 0.92
    # 本题答案为C / 答案选A / 答案为 B
    - pattern: '答案\s*[是为选]\s*[\[［（(【]?\s*([A-E])(?![A-Za-z])'
      confidence: 0.90
    # C【解析】 / C.［解析］ / B解析： / B分析：
    - pattern: '^[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*[.．、]?\s*[【［]?(?:解析|分析)[】］]?'
      confidence: 0.88
    # 解析： C。 / 分析:选D，
    - pattern: '(?:解析|分析)\s*[：:]\s*(?:本题)?(?:答案)?(?:选)?\s*[\[［（(【]?\s*([A-E])(?![A-Za-z])'
      confidence: 0.80
    # 裸字母：11、D（整块内容就是一个字母，或字母后跟中文/标点）
    - pattern: '^[\[［（(【]?\s*([A-E])\s*[\]］）)】]?\s*(?![A-Za-z0-9\u4e00-\u9fff])'
      confidence: 0.70

explanation:
  patterns:
    - '^\s*解析[：:]'
    - '^\s*解析[一二三四五六七八九十]?[：:]'
    - '^\s*解析\s*$'

# 解析分区标题，出现后进入「答案/解析」上下文
#
# 实测：分区标题经常带前缀（如「职业能力测试答案及解析」），
# 早期只写 `^答案解析$` 这类严格全行匹配，导致整片答案区被当成题目
# （样例 D 因此多出 598 道假题、真答案一条也没匹配上）。
# 这里放宽为「允许 0–12 字前缀」+「与/及/和」连接词，
# 行长度上限由 rules.match_answer_section() 的 len<=20 守卫。
answer_section:
  patterns:
    - '^.{0,12}(?:参考)?答案\s*(?:与|及|和)?\s*(?:解析|详解|解答)\s*[：:]?\s*$'
    - '^.{0,12}(?:参考)?答案\s*[：:]?\s*$'

group_title:
  patterns:
    - '^\s*第[一二三四五六七八九十]+部分\s*(.+)$'
    - '^\s*[一二三四五六七八九十]+、\s*(.+)$'
    # 板块栏目名：实测 147 页的题库正文按板块排版，题号在**板块内重置**
    # （常识 1–100、言语 1–150、数量 1–80、判断 1–160、资料分析每组 1–5）。
    # 不把它们识别成题组，题目就失去板块归属，展示顺序会全乱、看起来像"漏题"。
    - '^\s*(?:第[一二三四五六七八九十]+部分\s*)?(常识判断|常识|言语理解与表达|言语理解|数量关系|判断推理|资料分析)\s*$'

# 卷首须知区间：从 start 命中的行开始丢弃，直到 end 命中或出现大题组标题。
# 实测样卷须知里的 `1. 监考老师宣布考试开始时…` 会被误判成题 1。
preamble:
  start:
    - '^说明\s*[：:]?\s*$'
    - '^考试须知'
    - '^考生须知'
    - '^注意事项'
    - '^请仔细阅读以下'
    - '^请仔细阅读下面'
  end:
    - '^\s*第[一二三四五六七八九十]+部分'
    - '^\s*[A-D]\s*卷\b'
    - '^[一二三四五六七八九十]+、'

noise:
  # 页码，如「12 / 43」
  - '^\s*\d+\s*/\s*\d+\s*$'
  # --- 实测水印与广告 ---
  # 下列规则来自对用户语料（181 份 PDF）的跨页重复行扫描。
  # 对方会不断换微信号（offertop / deoffer / eehelp / toeekk / helpoffer /
  # nuupee / Luckoffer / galerjim），所以按**结构特征**收口：
  # 「微信+冒号」这一条就能覆盖绝大多数变体，不必逐个枚举。
  - '微信\s*[：:;；]'
  - '本资料仅限购买者'
  - '无忧上岸'
  - '考佳卜资料网'
  - 'kaojiabo\.com'
  - '51jobs\.taobao\.com'
  - '淘宝店铺地址'
  - 'shop108498359'
  - '(?i)(?:offertop|deoffer|eehelp|toeekk|helpoffer|nuupee|luckoffer|galerjim)'
  - '各类考试包过无忧'
  - '各类笔试考试包过无忧'
  - '包过各类国企央企银行'
  - '各类国企央企银行笔试高分'

defaults:
  question_type: single
  option_count_hint: 4
