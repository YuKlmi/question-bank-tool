# 规则模板：行测-答案集中式（样例 B 型）
#
# 适配特征：题目区在前、答案与解析集中在后；题号不重复；
#           选项标记为 [A] 全角方括号形式。
#
# 正则约定：每题号/选项/答案规则的**第 1 个捕获组**必须是关键值，
#           答案规则的第 2 个捕获组是答案字母。

id: pdf-consolidated
name: 行测-答案集中式
description: 题目区与答案区分离，答案标记高度统一（如「解析：正确答案是[D]。」）

question_no:
  patterns:
    - '^\s*(\d{1,4})\s*[.．]\s*'

# 选项标记：不带 ^ 锚点，供行内扫描（一行可能含多个选项）
option_mark:
  # [A] / （A）/ (A) / 【A】 形式（样例 B 主力形态）
  - '[\[（(【]\s*([A-D])\s*[\]）)】]'
  # 兼容「A. / A、/ A．」裸标记
  - '(?<![A-Za-z0-9])([A-D])\s*[.．、]'

answer:
  rules:
    # 末尾可选地吞掉「]）」和「。」，否则这些符号会污染解析正文
    - pattern: '^\s*(\d{1,4})\s*[.．]\s*解析[：:]\s*正确答案是\s*[\[（(【]?\s*([A-D])\s*[\]）)】]?\s*[。.．]?'
      confidence: 0.99
    - pattern: '^\s*(\d{1,4})\s*[.．]\s*参考答案[：:]\s*[\[（(【]?\s*([A-D])\s*[\]）)】]?\s*[。.．]?'
      confidence: 0.95

explanation:
  patterns:
    - '^\s*解析[：:]'
    - '^\s*解析[一二三四五六七八九十]?[：:]'
    - '^\s*解析\s*$'

# 解析分区标题，出现后进入「答案/解析」上下文
answer_section:
  patterns:
    - '^答案与解析\s*$'
    - '^参考答案\s*[:：]?\s*$'
    - '^答案解析\s*$'

group_title:
  patterns:
    - '^\s*第[一二三四五六七八九十]+部分\s*(.+)$'
    - '^\s*[一二三四五六七八九十]+、\s*(.+)$'

noise:
  # 页码，如「12 / 43」
  - '^\s*\d+\s*/\s*\d+\s*$'
  # 实测发现的三类水印与广告
  - '各类考试包过无忧'
  - 'offertop'
  - '考佳卜资料网'
  - 'kaojiabo\.com'
  - '淘宝店铺地址'
  - 'shop108498359'

defaults:
  question_type: single
  option_count_hint: 4
